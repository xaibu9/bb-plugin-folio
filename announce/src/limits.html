<!doctype html><html><head><meta charset="utf-8"><style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;background:radial-gradient(1200px 700px at 78% 40%,#343548 0%,#21222c 60%,#1b1c25 100%);font-family:Inter,system-ui,sans-serif;color:#f8f8f2;overflow:hidden;position:relative}
.text{position:absolute;left:96px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:22px}

p{font-size:24px;line-height:1.4;color:color-mix(in oklch,#f8f8f2 72%,#282a36);max-width:520px}
